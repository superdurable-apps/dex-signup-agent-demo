# The application manifest, strict YAML: no anchors, aliases, tags or
# repeated keys. Quote every value that YAML 1.1 and 1.2 read differently, such
# as a dotted version ("0.7.0"), yes/no/on/off or a leading zero.
# tools/appmanifest is the platform's decoder: it prints this file as the JSON
# that make check-fdg-v2 checks.
schemaVersion: dex.superdurable.io/dex-app/v1
application:
  port: 8080
  healthPath: /api/health
  # Hosted Worker slots (1 to 64); a review that waits for a reply holds none.
  workerSlots: 16
  # Set in Setup; docs/dex-cloud.md and docs/reference.md describe each one.
  environment:
    - name: REVIEW_API_URL
      required: true
      minLength: 1
    - name: REVIEW_API_KEY
      required: true
      secret: true
      minLength: 1
    # The key for an anthropic/... SIGNUP_AGENT_PI_MODEL, the default model.
    - name: ANTHROPIC_API_KEY
      secret: true
      minLength: 1
    # An RFC 3339 time: only sign-ups registered since then are reviewed.
    - name: SIGNUP_REVIEW_SINCE
      required: true
      minLength: 20
    # Only the pi harness runs hosted.
    - name: SIGNUP_AGENT_HARNESS
      enum: [pi]
    - name: SIGNUP_AGENT_PI_MODEL
      minLength: 1
    # An OpenAI- or Anthropic-compatible endpoint instead of Anthropic's API.
    - name: SIGNUP_AGENT_PI_BASE_URL
      minLength: 1
    - name: SIGNUP_AGENT_PI_PROTOCOL
      enum: [openai, anthropic]
    - name: SIGNUP_AGENT_PI_API_KEY
      secret: true
      minLength: 1
    - name: SIGNUP_WATCH_INTERVAL_SECONDS
    - name: GITHUB_TOKEN
      secret: true
    # The onboarding wizard (docs/onboarding.md): off unless "true".
    - name: ONBOARDING_ENABLED
      enum: ["true", "false"]
    # An RFC 3339 time: only accounts approved since then are onboarded.
    - name: ONBOARDING_SINCE
      minLength: 20
    # The usage operations; they default to REVIEW_API_URL and REVIEW_API_KEY.
    - name: ONBOARDING_USAGE_API_URL
      minLength: 1
    - name: ONBOARDING_USAGE_API_KEY
      secret: true
      minLength: 1
    # An Anthropic model ID (claude-opus-5-5 by default, with ANTHROPIC_API_KEY), or an endpoint's model ID.
    - name: ONBOARDING_AGENT_MODEL
      minLength: 1
    - name: ONBOARDING_AGENT_BASE_URL
      minLength: 1
    - name: ONBOARDING_AGENT_API_KEY
      secret: true
      minLength: 1
    - name: ONBOARDING_WATCH_INTERVAL_SECONDS
    - name: ONBOARDING_MAX_NUDGES
    - name: ONBOARDING_MIN_NUDGE_GAP_DAYS
    - name: ONBOARDING_WINDOW_DAYS
  # The model settings: one group must be complete, so a publish without them is blocked in Setup instead of
  # the application crashing at start. The code takes the endpoint group when SIGNUP_AGENT_PI_BASE_URL is set,
  # else the Anthropic key (src/config.ts piModelSelection).
  requiredOneOf:
    - label: Model
      groups:
        - [SIGNUP_AGENT_PI_BASE_URL, SIGNUP_AGENT_PI_MODEL, SIGNUP_AGENT_PI_API_KEY]
        - [ANTHROPIC_API_KEY]
# The committed pi session graph; make session-graphs writes it.
flowDefinitions:
  - sourcePath: flow-definitions/signup-review-pi-agent.json
  # The onboarding wizard's session graph; it runs only with ONBOARDING_ENABLED=true.
  - sourcePath: flow-definitions/onboarding-vercel-ai-agent.json
# Each package and version must equal the one package.json pins.
connectors:
  - connectionName: review-slack
    connectorId: slack
    package: "@superdurable/connector-slack"
    version: "0.8.0"
    authMethodId: ""
    operations: [postChannelMessage, postThreadReply]
    # Must match scripts/session-trigger-bindings.json and the session graphs'
    # v2.connectorTriggerBindings; make check-fdg-v2 compares them.
    triggerBindings:
      - triggerName: threadReplyCreated
        bindingName: signup-review-reply
  - connectionName: welcome-gmail
    connectorId: gmail
    package: "@superdurable/connector-google-gmail"
    version: "0.5.1"
    authMethodId: google-oauth
    operations: [sendMessage]
